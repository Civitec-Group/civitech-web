  <!-- Lightbox galería: tocar una foto la abre grande -->
  <script>
    window.addEventListener('load', function () {
      function initLb() {
        var figs = [].slice.call(document.querySelectorAll('.gallery figure'));
        if (!figs.length) { return false; }
        if (document.querySelector('.lb')) { return true; }
        var data = figs.map(function (f) { var im = f.querySelector('img'), c = f.querySelector('figcaption'); return { src: im ? im.src : '', alt: im ? im.alt : '', cap: c ? c.textContent : '' }; });
        var lb = document.createElement('div'); lb.className = 'lb';
        lb.innerHTML = '<button class="lb-close" aria-label="Cerrar">×</button><button class="lb-nav lb-prev" aria-label="Anterior">‹</button><figure><img alt=""><figcaption></figcaption></figure><button class="lb-nav lb-next" aria-label="Siguiente">›</button><div class="lb-count"></div>';
        document.body.appendChild(lb);
        var big = lb.querySelector('img'), cap = lb.querySelector('figcaption'), cnt = lb.querySelector('.lb-count'), i = 0;
        function show(n) { i = (n + data.length) % data.length; big.src = data[i].src; big.alt = data[i].alt; cap.textContent = data[i].cap; cnt.textContent = (i + 1) + ' / ' + data.length; }
        function openAt(n) { show(n); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
        function close() { lb.classList.remove('open'); document.body.style.overflow = ''; }
        figs.forEach(function (f, n) { f.addEventListener('click', function () { openAt(n); }); });
        lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
        lb.querySelector('.lb-close').addEventListener('click', close);
        lb.querySelector('.lb-prev').addEventListener('click', function (e) { e.stopPropagation(); show(i - 1); });
        lb.querySelector('.lb-next').addEventListener('click', function (e) { e.stopPropagation(); show(i + 1); });
        document.addEventListener('keydown', function (e) { if (!lb.classList.contains('open')) return; if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') show(i - 1); else if (e.key === 'ArrowRight') show(i + 1); });
        var x0 = null;
        lb.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
        lb.addEventListener('touchend', function (e) { if (x0 === null || data.length < 2) { x0 = null; return; } var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 45) show(dx < 0 ? i + 1 : i - 1); x0 = null; });
        return true;
      }
      if (!initLb()) { var t = setInterval(function () { if (initLb()) clearInterval(t); }, 800); setTimeout(function () { clearInterval(t); }, 12000); }
    });
  </script>
