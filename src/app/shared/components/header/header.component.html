<header>

  <div class="menu-principal-redes">
    <div class="siguenos d-flex ">
      <p class="redes align-items-center justify-content-start">
        <a href="https://www.facebook.com/share/1A3PRQzJHb/" target="_blank"><span class="color-gris"><i
              class="fa-brands fa-facebook-f"></i></span></a>
        <a href="https://www.instagram.com/civitec.domotica" target="_blank"><span
            class="color-gris"><i class="fa-brands fa-instagram"></i></span></a>
        <a href="https://www.linkedin.com/company/civitech-es" target="_blank"><span class="color-gris"><i class="fa-brands fa-linkedin-in"></i></span></a>
        <a href="https://www.tiktok.com/@civitech.es?_t=ZG-8t9VrCIYaPo&_r=1" target="_blank"><span class="color-gris"><i
              class="fa-brands fa-tiktok"></i></span></a>
        <a href="https://www.youtube.com/@civitec-domotica" target="_blank"><span class="color-gris"><i
              class="fa-brands fa-youtube"></i></span></a>
      </p>
    </div>

  </div>


  <div class="header-container">
    <!-- Logo -->
    <div class="logo">
      <a routerLink="/"><img class="logo" src="/assets/images/logo_civitec_domotica_blanco.png" alt="Civitec Domótica - Domótica en Zaragoza"></a>
    </div>

    <!-- Botón de menú hamburguesa (visible en XS, SM) -->
    <button class="hamburger" (click)="toggleMenu()">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Menú de navegación -->
    <nav [ngClass]="{ 'active': isMenuOpen }">
      <!-- Botón de cerrar dentro del menú en móviles (solo se muestra en SM y XS) -->
      <button class="close-btn" (click)="closeMenu()">
        <i class="fas fa-times"></i>
      </button>
      <!-- <li><a [routerLink]="['/contactanos']" routerLinkActive="active-link" (click)="closeMenu()" class="text-decoration-none text-shadow">Domótica</a></li>
          <li><a [routerLink]="['/contactanos']" routerLinkActive="active-link" (click)="closeMenu()" class="text-decoration-none text-shadow">Proyectos</a></li> -->

      <ul class="menu">
        <li>
          <a href="#" (click)="navigateTo('/acerca-de-nosotros'); $event.preventDefault();"
            routerLink="/acerca-de-nosotros" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
            class="text-decoration-none text-shadow">
            Acerca de Nosotros
          </a>
        </li>

        <li>
          <a href="#" (click)="navigateTo('/domotica-informacion'); $event.preventDefault();"
            routerLink="/domotica-informacion" routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }" class="text-decoration-none text-shadow">
            Servicios
          </a>
        </li>

        <li>
          <a href="#" (click)="navigateTo('/empresas'); $event.preventDefault();" routerLink="/empresas"
            routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
            class="text-decoration-none text-shadow">
            Empresas
          </a>
        </li>

        <li>
          <a href="#" (click)="navigateTo('/proyectos'); $event.preventDefault();" routerLink="/proyectos"
            routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
            class="text-decoration-none text-shadow">
            Proyectos
          </a>
        </li>

        <li>
          <a href="#" (click)="navigateTo('/instaladores'); $event.preventDefault();" routerLink="/instaladores"
            routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
            class="text-decoration-none text-shadow">
            Partners
          </a>
        </li>

        <li>
          <a href="#" (click)="navigateTo('/contactanos'); $event.preventDefault();" routerLink="/contactanos"
            routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()"
            class="text-decoration-none text-shadow item-menu-contacto">
            Contáctanos
          </a>
        </li>
      </ul>

    </nav>
  </div>
</header>

<!-- Capa de fondo oscurecido cuando el menú está abierto -->
<div class="overlay" *ngIf="isMenuOpen" (click)="closeMenu()"></div>
