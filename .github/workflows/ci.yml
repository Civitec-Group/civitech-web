name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: npm install + prestart + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prestart (genera environment.ts desde .env.example)
        run: cp .env.example .env && node set-env.js

      - name: Build (verifica que Angular compila)
        run: npm run build
