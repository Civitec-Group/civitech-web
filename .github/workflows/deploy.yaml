name: Build and Deploy Angular App

on:
  push:
    branches:
      - main  # Rama que activará el deploy

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Angular app (prerender)
        run: npm run prerender
        env:
          NODE_ENV: production
          # Chatbot proxy — la API key de OpenAI se configura en n8n, NUNCA aquí
          CHATBOT_WEBHOOK_URL: ${{ secrets.CHATBOT_WEBHOOK_URL }}
          # Webhook n8n para leads del formulario de contacto
          N8N_LEAD_WEBHOOK_URL: ${{ secrets.N8N_LEAD_WEBHOOK_URL }}
          # EmailJS
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}

      - name: List dist directory
        run: ls -l ./dist/civitech.web/browser | head

      # 2026-10-15: civitech.es MIGRADO a Cloudflare Pages (proyecto "civitec-domotica").
      # El sitio se sirve desde Pages (ni CT124 ni Hostinger). Cada push a main publica aqui solo.
      # Deploy directo por wrangler; el dominio civitech.es esta enganchado al proyecto (custom domain).
      - name: Deploy to Cloudflare Pages
        run: cp _redirects dist/civitech.web/browser/_redirects && npx wrangler@3 pages deploy dist/civitech.web/browser --project-name=civitec-domotica --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}