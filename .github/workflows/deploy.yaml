name: Build and Deploy Angular App

on:
  push:
    branches:
      - main  # Rama que activará el deploy

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Angular app (prerender)
        run: npm run prerender
        env:
          NODE_ENV: production
          # Chatbot proxy — la API key de OpenAI se configura en n8n, NUNCA aquí
          CHATBOT_WEBHOOK_URL: ${{ secrets.CHATBOT_WEBHOOK_URL }}
          # Webhook n8n para leads del formulario de contacto
          N8N_LEAD_WEBHOOK_URL: ${{ secrets.N8N_LEAD_WEBHOOK_URL }}
          # EmailJS
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}

      - name: List dist directory
        run: ls -l ./dist/civitech.web/browser | head

      # Deploy robusto por FTPS (2026-08-04): sustituye el lftp a pelo (fallaba con
      # "max-retries exceeded" por la negociacion SSL/pasiva desde la red de GitHub).
      # SamKirkland/FTP-Deploy-Action usa basic-ftp: mejor SSL/reintentos y solo sube lo que cambia.
      # IP origen de Hostinger directa (Cloudflare no enruta FTP). Misma password (secret).
      - name: Deploy to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 46.202.158.245
          port: 21
          protocol: ftps
          security: loose
          username: u824079794.hostinger
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/civitech.web/browser/
          server-dir: /
          timeout: 60000